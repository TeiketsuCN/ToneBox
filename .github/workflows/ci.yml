name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fc-core:
    name: cargo test -p fc-core --lib
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 单元测试（格式表 / 参数映射 / 警告逻辑）
        run: cargo test -p fc-core --lib
